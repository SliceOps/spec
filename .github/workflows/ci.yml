# SPDX-License-Identifier: MIT
# Recursive dogfooding — now REAL (per DR-2026-06-19 dogfooding-enforcement-mandate,
# INS-012, LP-003): the SliceOps spec repo RUNS the consistency validators it
# publishes, fetched from the toolkit (no vendored copy → no drift, per LP-002
# / audit §2.5). A prescribed gate that does not run is a build failure, not a
# header comment.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege GITHUB_TOKEN (defense-in-depth; every step here only reads).
permissions:
  contents: read
  pull-requests: read

# Layer B.2 — concurrency cancel-in-progress (dominant cost lever, P9)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layer B.2 — aggregation-required-gate: single required check.
  ci-gate:
    if: github.event.pull_request.draft == false   # Layer B.2 draft-skip
    runs-on: ubuntu-latest
    steps:
      - name: DCO sign-off check (every non-merge commit Signed-off-by its author)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$PR_REPO/pulls/$PR_NUM/commits" \
            --jq '.[] | select((.parents|length) < 2) | [.sha[0:8], .commit.author.name, .commit.author.email, (.commit.message|@base64)] | @tsv' \
          | python3 -c '
          import base64, sys
          bad = []
          for line in sys.stdin:
              parts = line.rstrip("\n").split("\t")
              if len(parts) < 4:
                  continue
              sha, name, email, msg_b64 = parts[0], parts[1], parts[2], parts[3]
              msg = base64.b64decode(msg_b64).decode("utf-8", "replace")
              if f"signed-off-by: {name} <{email}>".lower() not in msg.lower():
                  bad.append((sha, name, email))
          if bad:
              print("::error::Missing DCO sign-off. Add it with:  git commit -s   (or  git rebase --signoff origin/main).")
              for sha, name, email in bad:
                  print(f"  - {sha}: needs  Signed-off-by: {name} <{email}>")
              sys.exit(1)
          print("DCO: all non-merge commits signed off by their author")
          '
      - name: Checkout spec
        uses: actions/checkout@v4
        with:
          path: spec
      - name: Checkout toolkit (the validator engine — fetched, not vendored)
        uses: actions/checkout@v4
        with:
          repository: SliceOps/toolkit
          path: toolkit
          # Same-org repo. Public org: default token suffices. While private,
          # set a read-scoped token here (token: ${{ secrets.TOOLKIT_RO }}).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lightweight structure smoke test
        working-directory: spec
        run: |
          set -e
          for d in spec reference decisions examples governance; do
            test -d "$d" || { echo "::error::missing top-level folder: $d"; exit 1; }
          done
          test -f README.md && test -f DISCLOSURE.md && test -f GOVERNANCE.md
          # LICENSE is ratified (DR-2026-06-15) — its presence is now REQUIRED,
          # replacing the prior stale "no LICENSE until ratified" gate.
          test -f LICENSE && test -f LICENSE-CODE || { echo "::error::LICENSE/LICENSE-CODE missing (ratified per DR-2026-06-15)"; exit 1; }
          echo "structure: PASS"
      - name: Consistency validators (R-rules — the gate this repo publishes, now enforced)
        run: |
          python3 toolkit/templates/consistency-validators/validators.py \
            --root spec \
            --checks all \
            --topic-taxonomy spec/spec/v1.1.0/topics.md
      - name: Secrets scan (gitleaks)
        # P7 Security-by-Construction. Working-tree scan of the spec checkout;
        # fails the job on any finding. Pinned image for reproducibility.
        run: |
          docker run --rm -v "$PWD/spec:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git --redact -v
